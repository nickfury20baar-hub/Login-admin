<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background: linear-gradient(
        135deg,
        #111827,
        #1e3a8a
      );
    }

    .box {
      width: 90%;
      max-width: 380px;

      padding: 30px;

      border-radius: 18px;

      background: rgba(255,255,255,0.12);

      backdrop-filter: blur(15px);

      box-shadow:
        0 20px 50px rgba(0,0,0,0.4);

      color: white;
    }

    h1,
    h2 {
      text-align: center;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #d1d5db;
      margin-bottom: 20px;
    }

    input {
      width: 100%;

      margin-top: 10px;

      padding: 13px;

      border: none;
      border-radius: 9px;

      outline: none;

      font-size: 15px;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 45px;
    }

    #togglePassword {
      position: absolute;

      right: 10px;
      top: 50%;

      transform: translateY(-20%);

      border: none;
      background: transparent;

      cursor: pointer;

      font-size: 18px;
    }

    button {
      width: 100%;

      padding: 13px;

      margin-top: 12px;

      border: none;
      border-radius: 9px;

      cursor: pointer;

      font-size: 15px;
      font-weight: bold;
    }

    .login-btn {
      background: #2563eb;
      color: white;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .google-btn {
      background: white;
      color: #222;
    }

    .google-btn:hover {
      background: #f3f4f6;
    }

    .logout-btn {
      background: #dc2626;
      color: white;
    }

    .divider {
      display: flex;

      align-items: center;

      gap: 10px;

      margin: 18px 0;

      color: #d1d5db;

      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background: rgba(255,255,255,0.3);
    }

    #message {
      min-height: 20px;

      margin-top: 15px;

      text-align: center;

      font-size: 14px;

      color: #fca5a5;
    }

    .success-icon {
      width: 80px;
      height: 80px;

      margin: 0 auto 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      background: #22c55e;

      font-size: 45px;
    }

    .user-info {
      margin-top: 20px;

      padding: 15px;

      border-radius: 10px;

      background: rgba(255,255,255,0.1);

      text-align: center;

      color: #d1d5db;
    }

    .hidden {
      display: none;
    }
  </style>
</head>


<body>


  <!-- =================================================
       LOGIN PAGE
  ================================================== -->

  <div
    id="loginPage"
    class="box"
  >

    <h1>Welcome Back</h1>

    <div class="subtitle">
      Sign in to continue
    </div>


    <input
      id="username"
      type="email"
      placeholder="Enter email"
      autocomplete="username"
    >


    <div class="password-box">

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
      >

      <button
        id="togglePassword"
        type="button"
        style="
          width:auto;
          margin:0;
          padding:5px;
        "
      >
        👁️
      </button>

    </div>


    <button
      id="loginButton"
      class="login-btn"
      type="button"
    >
      Login
    </button>


    <div class="divider">
      OR
    </div>


    <button
      id="googleButton"
      class="google-btn"
      type="button"
    >
      🔵 Continue with Google
    </button>


    <div id="message"></div>

  </div>



  <!-- =================================================
       SUCCESS PAGE
  ================================================== -->

  <div
    id="successPage"
    class="box hidden"
  >

    <div class="success-icon">
      ✓
    </div>

    <h1>
      Logged In Successfully
    </h1>

    <div class="subtitle">
      Welcome! You have successfully
      authenticated.
    </div>


    <div class="user-info">

      <div>
        Logged in as:
      </div>

      <strong id="loggedInEmail">
        -
      </strong>

    </div>


    <button
      id="logoutButton"
      class="logout-btn"
    >
      Logout
    </button>

  </div>



  <!-- =================================================
       FIREBASE
  ================================================== -->

  <script type="module">

    import {
      initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithRedirect,
      getRedirectResult,
      signOut
    }
    from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    /* =================================================
       FIREBASE CONFIG
    ================================================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCcwr6vNVpoQ0Tdl8OfBM8E2MvDmwKQ3BQ",

      authDomain:
        "login-project-a90bc.firebaseapp.com",

      databaseURL:
        "https://login-project-a90bc-default-rtdb.firebaseio.com",

      projectId:
        "login-project-a90bc",

      storageBucket:
        "login-project-a90bc.firebasestorage.app",

      messagingSenderId:
        "86568965871",

      appId:
        "1:86568965871:web:e000bcfe034bdce1202d1a"
    };


    /* =================================================
       INITIALIZE FIREBASE
    ================================================= */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);


    /* =================================================
       ELEMENTS
    ================================================= */

    const loginPage =
      document.getElementById("loginPage");

    const successPage =
      document.getElementById("successPage");

    const username =
      document.getElementById("username");

    const password =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const googleButton =
      document.getElementById("googleButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const message =
      document.getElementById("message");

    const loggedInEmail =
      document.getElementById(
        "loggedInEmail"
      );

    const togglePassword =
      document.getElementById(
        "togglePassword"
      );


    /*
     * Stores whether Google authentication
     * has already succeeded.
     */

    let googleAuthenticated = false;


    /* =================================================
       MESSAGE
    ================================================= */

    function showMessage(
      text,
      success = false
    ) {

      message.textContent = text;

      message.style.color =
        success
          ? "#86efac"
          : "#fca5a5";
    }


    /* =================================================
       SHOW SUCCESS PAGE
    ================================================= */

    function showSuccessPage(user) {

      loginPage.classList.add("hidden");

      successPage.classList.remove("hidden");

      loggedInEmail.textContent =
        user.email ||
        user.displayName ||
        "Authenticated user";
    }


    /* =================================================
       EMAIL + PASSWORD LOGIN
    ================================================= */

    async function attemptLogin() {

      /*
       * If Google authentication has already
       * succeeded, the Login button simply
       * completes the login flow.
       */

      if (googleAuthenticated) {

        const user =
          auth.currentUser;

        if (user) {

          showSuccessPage(user);

          return;
        }
      }


      const email =
        username.value.trim();

      const userPassword =
        password.value;


      if (!email) {

        showMessage(
          "Please enter your email."
        );

        return;
      }


      if (!userPassword) {

        showMessage(
          "Please enter your password."
        );

        return;
      }


      try {

        loginButton.disabled = true;

        loginButton.textContent =
          "Checking...";


        const result =
          await signInWithEmailAndPassword(
            auth,
            email,
            userPassword
          );


        showSuccessPage(
          result.user
        );


      } catch (error) {

        console.error(
          error
        );


        if (
          error.code ===
          "auth/invalid-credential"
        ) {

          showMessage(
            "Invalid email or password."
          );

        } else {

          showMessage(
            "Login error: " +
            error.code
          );
        }

      } finally {

        loginButton.disabled = false;

        loginButton.textContent =
          "Login";
      }
    }


    /* =================================================
       GOOGLE LOGIN
    ================================================= */

    async function googleLogin() {

      try {

        googleButton.disabled = true;

        googleButton.textContent =
          "Opening Google...";


        const provider =
          new GoogleAuthProvider();


        provider.setCustomParameters({
          prompt: "select_account"
        });


        /*
         * Google authentication happens here.
         *
         * After returning from Google,
         * handleGoogleRedirect() will fill
         * the email field.
         */

        await signInWithRedirect(
          auth,
          provider
        );

      } catch (error) {

        console.error(
          "Google error:",
          error
        );

        showMessage(
          "Google error: " +
          error.code
        );

        googleButton.disabled =
          false;

        googleButton.textContent =
          "🔵 Continue with Google";
      }
    }


    /* =================================================
       HANDLE GOOGLE RETURN
    ================================================= */

    async function handleGoogleRedirect() {

      try {

        const result =
          await getRedirectResult(auth);


        if (!result) {
          return;
        }


        const user =
          result.user;


        /*
         * Fill the email field.
         */

        username.value =
          user.email || "";


        /*
         * Google password is intentionally
         * NOT filled.
         */

        password.value = "";


        /*
         * Remember that Google authentication
         * has already succeeded.
         */

        googleAuthenticated = true;


        showMessage(
          "Google verified. Now click Login.",
          true
        );


        /*
         * The page stays on the login screen.
         *
         * The user must click Login.
         */

        loginButton.textContent =
          "Login";


      } catch (error) {

        console.error(
          "Google redirect error:",
          error
        );


        showMessage(
          "Google error: " +
          error.code
        );
      }
    }


    /* =================================================
       LOGOUT
    ================================================= */

    async function logout() {

      try {

        await signOut(auth);


        googleAuthenticated =
          false;


        username.value = "";

        password.value = "";


        successPage.classList.add(
          "hidden"
        );

        loginPage.classList.remove(
          "hidden"
        );


        showMessage(
          "You have been logged out.",
          true
        );


      } catch (error) {

        console.error(
          error
        );
      }
    }


    /* =================================================
       PASSWORD SHOW / HIDE
    ================================================= */

    togglePassword.addEventListener(
      "click",
      () => {

        if (
          password.type ===
          "password"
        ) {

          password.type = "text";

          togglePassword.textContent =
            "🙈";

        } else {

          password.type =
            "password";

          togglePassword.textContent =
            "👁️";
        }

      }
    );


    /* =================================================
       BUTTONS
    ================================================= */

    loginButton.addEventListener(
      "click",
      attemptLogin
    );


    googleButton.addEventListener(
      "click",
      googleLogin
    );


    logoutButton.addEventListener(
      "click",
      logout
    );


    /* =================================================
       ENTER KEY
    ================================================= */

    username.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          attemptLogin();
        }
      }
    );


    password.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          attemptLogin();
        }
      }
    );


    /* =================================================
       CHECK GOOGLE REDIRECT
    ================================================= */

    handleGoogleRedirect();

  </script>

</body>
</html>
