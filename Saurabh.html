<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(135deg, #111827, #1e3a8a);
    }

    .login-box {
      width: 90%;
      max-width: 380px;

      padding: 30px;

      border-radius: 18px;

      background: rgba(255,255,255,0.12);

      backdrop-filter: blur(15px);

      box-shadow:
        0 20px 50px rgba(0,0,0,0.4);
    }

    h2 {
      margin: 0;

      color: white;
      text-align: center;
    }

    .subtitle {
      margin: 8px 0 20px;

      color: #d1d5db;
      text-align: center;
    }

    input {
      width: 100%;

      margin-top: 10px;

      padding: 13px;

      border: none;
      border-radius: 9px;

      outline: none;

      font-size: 15px;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 45px;
    }

    #togglePassword {
      position: absolute;

      right: 10px;
      top: 50%;

      transform: translateY(-20%);

      border: none;
      background: transparent;

      cursor: pointer;

      font-size: 18px;
    }

    button {
      cursor: pointer;
    }

    .login-btn,
    .google-btn {
      width: 100%;

      margin-top: 14px;

      padding: 13px;

      border: none;
      border-radius: 9px;

      font-size: 15px;
      font-weight: bold;
    }

    .login-btn {
      background: #2563eb;
      color: white;
    }

    .login-btn:hover {
      background: #1d4ed8;
    }

    .google-btn {
      margin-top: 12px;

      background: white;
      color: #222;
    }

    .google-btn:hover {
      background: #f3f4f6;
    }

    .divider {
      display: flex;

      align-items: center;

      gap: 10px;

      margin: 18px 0;

      color: #d1d5db;

      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background: rgba(255,255,255,0.3);
    }

    #message {
      min-height: 22px;

      margin-top: 15px;

      text-align: center;

      font-size: 14px;

      color: #fca5a5;
    }

    .footer {
      margin-top: 20px;

      color: #cbd5e1;

      text-align: center;

      font-size: 12px;
    }
  </style>
</head>


<body>

  <div class="login-box">

    <h2>Welcome Back</h2>

    <div class="subtitle">
      Sign in to continue
    </div>


    <input
      id="username"
      type="email"
      placeholder="Enter email"
      autocomplete="username"
    >


    <div class="password-box">

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
      >

      <button
        id="togglePassword"
        type="button"
      >
        👁️
      </button>

    </div>


    <button
      id="loginButton"
      class="login-btn"
      type="button"
    >
      Login
    </button>


    <div class="divider">
      OR
    </div>


    <button
      id="googleButton"
      class="google-btn"
      type="button"
    >
      🔵 Continue with Google
    </button>


    <div id="message"></div>


    <div class="footer">
      Secured with Firebase Authentication
    </div>

  </div>


<script type="module">

  /* =====================================================
     FIREBASE IMPORTS
  ===================================================== */

  import {
    initializeApp
  } from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


  import {
    getAuth,
    signInWithEmailAndPassword,
    GoogleAuthProvider,
    signInWithRedirect,
    getRedirectResult
  } from
  "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


  /* =====================================================
     YOUR FIREBASE CONFIG
  ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyCcwr6vNVpoQ0Tdl8OfBM8E2MvDmwKQ3BQ",

    authDomain:
      "login-project-a90bc.firebaseapp.com",

    databaseURL:
      "https://login-project-a90bc-default-rtdb.firebaseio.com",

    projectId:
      "login-project-a90bc",

    storageBucket:
      "login-project-a90bc.firebasestorage.app",

    messagingSenderId:
      "86568965871",

    appId:
      "1:86568965871:web:e000bcfe034bdce1202d1a"
  };


  /* =====================================================
     INITIALIZE FIREBASE
  ===================================================== */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);


  /* =====================================================
     ELEMENTS
  ===================================================== */

  const username =
    document.getElementById("username");

  const password =
    document.getElementById("password");

  const loginButton =
    document.getElementById("loginButton");

  const googleButton =
    document.getElementById("googleButton");

  const message =
    document.getElementById("message");

  const togglePassword =
    document.getElementById("togglePassword");


  /* =====================================================
     MESSAGE
  ===================================================== */

  function showMessage(
    text,
    success = false
  ) {

    message.textContent = text;

    message.style.color =
      success
      ? "#86efac"
      : "#fca5a5";
  }


  /* =====================================================
     EMAIL + PASSWORD LOGIN
  ===================================================== */

  async function attemptLogin() {

    const email =
      username.value.trim();

    const userPassword =
      password.value;


    if (!email) {

      showMessage(
        "Enter your email."
      );

      return;
    }


    if (!userPassword) {

      showMessage(
        "Enter your password."
      );

      return;
    }


    try {

      loginButton.disabled = true;

      loginButton.textContent =
        "Logging in...";


      const result =
        await signInWithEmailAndPassword(
          auth,
          email,
          userPassword
        );


      console.log(
        "Logged in:",
        result.user.uid
      );


      showMessage(
        "Login successful!",
        true
      );


      /*
       * When you create dashboard.html,
       * uncomment this:

       window.location.href =
         "dashboard.html";
      */


    } catch (error) {

      console.error(
        "Login error:",
        error
      );


      if (
        error.code ===
        "auth/invalid-credential"
      ) {

        showMessage(
          "Invalid email or password."
        );

      } else {

        showMessage(
          "Login error: " +
          error.code
        );
      }

    } finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "Login";
    }
  }


  /* =====================================================
     GOOGLE LOGIN
  ===================================================== */

  async function googleLogin() {

    try {

      googleButton.disabled = true;

      googleButton.textContent =
        "Opening Google...";


      const provider =
        new GoogleAuthProvider();


      provider.setCustomParameters({
        prompt: "select_account"
      });


      /*
       * Redirect to Google.
       */

      await signInWithRedirect(
        auth,
        provider
      );


    } catch (error) {

      console.error(
        "Google error:",
        error
      );


      showMessage(
        "Google error: " +
        error.code
      );


      googleButton.disabled = false;

      googleButton.textContent =
        "🔵 Continue with Google";
    }
  }


  /* =====================================================
     HANDLE GOOGLE REDIRECT
  ===================================================== */

  async function handleGoogleRedirect() {

    try {

      const result =
        await getRedirectResult(auth);


      if (!result) {
        return;
      }


      const user =
        result.user;


      /*
       * We can display the Google email.

       * The Google password is NEVER
       * accessible to this website.
       */

      username.value =
        user.email || "";

      password.value = "";


      console.log(
        "Google user:",
        user
      );


      showMessage(
        "Google login successful!",
        true
      );


      /*
       * Redirect to dashboard here:

       window.location.href =
         "dashboard.html";
      */


    } catch (error) {

      console.error(
        "Google redirect error:",
        error
      );


      if (
        error.code ===
        "auth/unauthorized-domain"
      ) {

        showMessage(
          "Domain is not authorized in Firebase."
        );

      }

      else if (
        error.code ===
        "auth/operation-not-allowed"
      ) {

        showMessage(
          "Google Sign-In is not enabled."
        );

      }

      else {

        showMessage(
          "Google error: " +
          error.code
        );
      }
    }
  }


  /* =====================================================
     PASSWORD SHOW / HIDE
  ===================================================== */

  togglePassword.addEventListener(
    "click",
    () => {

      if (
        password.type ===
        "password"
      ) {

        password.type = "text";

        togglePassword.textContent =
          "🙈";

      } else {

        password.type = "password";

        togglePassword.textContent =
          "👁️";
      }
    }
  );


  /* =====================================================
     BUTTON EVENTS
  ===================================================== */

  loginButton.addEventListener(
    "click",
    attemptLogin
  );


  googleButton.addEventListener(
    "click",
    googleLogin
  );


  /* =====================================================
     ENTER KEY
  ===================================================== */

  username.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        attemptLogin();
      }
    }
  );


  password.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        attemptLogin();
      }
    }
  );


  /* =====================================================
     CHECK GOOGLE REDIRECT
  ===================================================== */

  handleGoogleRedirect();

</script>

</body>
</html>
