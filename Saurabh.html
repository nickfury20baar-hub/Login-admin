<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Firebase Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: Arial, sans-serif;

      background:
        linear-gradient(135deg, #111827, #1e3a8a);
    }

    .login-container {
      width: 90%;
      max-width: 380px;

      padding: 30px;

      border-radius: 18px;

      background: rgba(255,255,255,0.12);

      backdrop-filter: blur(15px);

      box-shadow:
        0 20px 50px rgba(0,0,0,0.4);
    }

    .logo {
      width: 70px;
      height: 70px;

      margin: 0 auto 15px;

      border-radius: 50%;

      display: flex;
      justify-content: center;
      align-items: center;

      background: white;

      font-size: 30px;
    }

    h2 {
      margin: 0;

      text-align: center;

      color: white;
    }

    .subtitle {
      text-align: center;

      color: #d1d5db;

      font-size: 14px;

      margin: 8px 0 20px;
    }

    input {
      width: 100%;

      margin-top: 10px;

      padding: 13px;

      border: none;

      border-radius: 9px;

      outline: none;

      font-size: 15px;

      background: white;
    }

    .password-container {
      position: relative;
    }

    .password-container input {
      padding-right: 45px;
    }

    #togglePassword {
      position: absolute;

      right: 12px;
      top: 50%;

      transform: translateY(-20%);

      border: none;

      background: transparent;

      cursor: pointer;

      font-size: 18px;
    }

    .btn {
      width: 100%;

      margin-top: 14px;

      padding: 13px;

      border: none;

      border-radius: 9px;

      cursor: pointer;

      font-size: 15px;

      font-weight: bold;

      background: #2563eb;

      color: white;

      transition: 0.2s;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .google-btn {
      width: 100%;

      margin-top: 12px;

      padding: 13px;

      border: none;

      border-radius: 9px;

      cursor: pointer;

      font-size: 15px;

      font-weight: bold;

      background: white;

      color: #222;

      transition: 0.2s;
    }

    .google-btn:hover {
      background: #f3f4f6;
    }

    .divider {
      display: flex;

      align-items: center;

      gap: 10px;

      margin: 18px 0;

      color: #d1d5db;

      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";

      flex: 1;

      height: 1px;

      background: rgba(255,255,255,0.3);
    }

    #message {
      min-height: 20px;

      margin-top: 15px;

      text-align: center;

      font-size: 14px;

      color: #fca5a5;
    }

    .loading {
      opacity: 0.6;

      pointer-events: none;
    }

    .footer {
      margin-top: 20px;

      text-align: center;

      color: #cbd5e1;

      font-size: 12px;
    }
  </style>
</head>


<body>

  <div class="login-container">

    <div class="logo">
      🔐
    </div>

    <h2>Welcome Back</h2>

    <div class="subtitle">
      Sign in to continue
    </div>


    <!-- EMAIL / MOBILE FIELD -->
    <input
      id="username"
      type="text"
      placeholder="Enter email or mobile"
      autocomplete="username"
    >


    <!-- PASSWORD -->
    <div class="password-container">

      <input
        id="password"
        type="password"
        placeholder="Enter password"
        autocomplete="current-password"
      >

      <button
        id="togglePassword"
        type="button"
        onclick="togglePassword()"
      >
        👁️
      </button>

    </div>


    <!-- LOGIN -->
    <button
      id="loginButton"
      class="btn"
      onclick="attemptLogin()"
    >
      Login
    </button>


    <div class="divider">
      OR
    </div>


    <!-- GOOGLE LOGIN -->
    <button
      id="googleButton"
      class="google-btn"
      onclick="googleLogin()"
    >
      🔵 Continue with Google
    </button>


    <div id="message"></div>


    <div class="footer">
      Secured with Firebase Authentication
    </div>

  </div>


  <!-- =====================================================
       FIREBASE
  ====================================================== -->

  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      GoogleAuthProvider,
      signInWithPopup
    } from
    "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


    /* =====================================================
       YOUR FIREBASE CONFIG
    ====================================================== */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCcwr6vNVpoQ0Tdl8OfBM8E2MvDmwKQ3BQ",

      authDomain:
        "login-project-a90bc.firebaseapp.com",

      databaseURL:
        "https://login-project-a90bc-default-rtdb.firebaseio.com",

      projectId:
        "login-project-a90bc",

      storageBucket:
        "login-project-a90bc.firebasestorage.app",

      messagingSenderId:
        "86568965871",

      appId:
        "1:86568965871:web:e000bcfe034bdce1202d1a"
    };


    /* =====================================================
       INITIALIZE FIREBASE
    ====================================================== */

    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    /* =====================================================
       ELEMENTS
    ====================================================== */

    const username =
      document.getElementById("username");

    const password =
      document.getElementById("password");

    const message =
      document.getElementById("message");

    const loginButton =
      document.getElementById("loginButton");

    const googleButton =
      document.getElementById("googleButton");


    /* =====================================================
       SHOW MESSAGE
    ====================================================== */

    function showMessage(text, success = false) {

      message.textContent = text;

      if (success) {

        message.style.color = "#86efac";

      } else {

        message.style.color = "#fca5a5";

      }
    }


    /* =====================================================
       EMAIL + PASSWORD LOGIN
    ====================================================== */

    window.attemptLogin = async function () {

      const email =
        username.value.trim();

      const userPassword =
        password.value;


      if (!email) {

        showMessage(
          "Please enter your email."
        );

        return;
      }


      if (!userPassword) {

        showMessage(
          "Please enter your password."
        );

        return;
      }


      /*
       * Firebase email/password authentication
       * requires an email address.
       */

      if (!email.includes("@")) {

        showMessage(
          "Please enter a valid email address."
        );

        return;
      }


      try {

        loginButton.classList.add("loading");

        loginButton.textContent =
          "Logging in...";


        const result =
          await signInWithEmailAndPassword(
            auth,
            email,
            userPassword
          );


        const user =
          result.user;


        console.log(
          "Authenticated user:",
          user.uid
        );


        showMessage(
          "Login successful!",
          true
        );


        /*
         * Redirect after successful login.
         *
         * Uncomment this when you create
         * dashboard.html.
         */

        // window.location.href = "dashboard.html";


      } catch (error) {

        console.error(error);


        /*
         * Don't tell attackers whether
         * the email exists.
         */

        showMessage(
          "Invalid email or password."
        );


      } finally {

        loginButton.classList.remove(
          "loading"
        );

        loginButton.textContent =
          "Login";
      }

    };


    /* =====================================================
       GOOGLE LOGIN
    ====================================================== */

    window.googleLogin = async function () {

      try {

        googleButton.classList.add(
          "loading"
        );

        googleButton.textContent =
          "Signing in...";


        const provider =
          new GoogleAuthProvider();


        /*
         * Firebase opens Google's
         * authentication window.
         */

        const result =
          await signInWithPopup(
            auth,
            provider
          );


        const user =
          result.user;


        /*
         * Google gives us the authenticated
         * user's email.
         *
         * It NEVER gives your website
         * the Google password.
         */

        username.value =
          user.email || "";


        password.value = "";


        console.log(
          "Google user:",
          user.uid
        );


        console.log(
          "Email:",
          user.email
        );


        console.log(
          "Name:",
          user.displayName
        );


        showMessage(
          "Google login successful!",
          true
        );


        /*
         * Redirect after Google login.
         */

        // window.location.href = "dashboard.html";


      } catch (error) {

        console.error(error);


        showMessage(
          "Google sign-in failed or was cancelled."
        );


      } finally {

        googleButton.classList.remove(
          "loading"
        );

        googleButton.textContent =
          "🔵 Continue with Google";
      }

    };


    /* =====================================================
       PASSWORD VISIBILITY
    ====================================================== */

    window.togglePassword = function () {

      const button =
        document.getElementById(
          "togglePassword"
        );


      if (
        password.type === "password"
      ) {

        password.type = "text";

        button.textContent = "🙈";

      } else {

        password.type = "password";

        button.textContent = "👁️";
      }

    };


    /* =====================================================
       ENTER KEY LOGIN
    ====================================================== */

    username.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          attemptLogin();

        }

      }
    );


    password.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          attemptLogin();

        }

      }
    );

  </script>

</body>
</html>
