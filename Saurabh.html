<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    body {
      font-family: Arial;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      width: 320px;
      padding: 25px;
      background: #222;
      border-radius: 15px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      border: none;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #googleBtn {
      background: white;
      color: black;
    }

    #loginBtn {
      background: #4285f4;
      color: white;
    }

    #message {
      margin-top: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Login</h2>

  <input
    id="username"
    type="email"
    placeholder="Enter email"
  >

  <input
    id="password"
    type="password"
    placeholder="Enter password"
  >

  <button id="loginBtn">Login</button>

  <button id="googleBtn">
    Continue with Google
  </button>

  <div id="message"></div>

</div>


<script type="module">

import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";

import {
  getAuth,
  signInWithEmailAndPassword,
  GoogleAuthProvider,
  signInWithRedirect,
  getRedirectResult
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyCcwr6vNVpoQ0Tdl8OfBM8E2MvDmwKQ3BQ",
  authDomain: "login-project-a90bc.firebaseapp.com",
  databaseURL: "https://login-project-a90bc-default-rtdb.firebaseio.com",
  projectId: "login-project-a90bc",
  storageBucket: "login-project-a90bc.firebasestorage.app",
  messagingSenderId: "86568965871",
  appId: "1:86568965871:web:e000bcfe034bdce1202d1a"
};


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const username = document.getElementById("username");
const password = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const googleBtn = document.getElementById("googleBtn");
const message = document.getElementById("message");


// This remembers that Google authentication was completed
let googleAuthenticated = false;


// ------------------------------------
// CONTINUE WITH GOOGLE
// ------------------------------------

googleBtn.addEventListener("click", async () => {

  try {

    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({
      prompt: "select_account"
    });

    await signInWithRedirect(auth, provider);

  } catch (error) {

    message.textContent = error.message;
    message.style.color = "red";

  }

});


// ------------------------------------
// AFTER GOOGLE ACCOUNT SELECTION
// ------------------------------------

try {

  const result = await getRedirectResult(auth);

  if (result) {

    const user = result.user;

    // Fill ONLY the email
    username.value = user.email || "";

    // Never retrieve/fill Google's password
    password.value = "";

    googleAuthenticated = true;

    message.textContent =
      "Google account verified. Now click Login.";

    message.style.color = "lightgreen";
  }

} catch (error) {

  message.textContent = error.message;
  message.style.color = "red";

}


// ------------------------------------
// LOGIN BUTTON
// ------------------------------------

loginBtn.addEventListener("click", async () => {

  message.textContent = "";

  // GOOGLE LOGIN FLOW
  if (googleAuthenticated) {

    const user = auth.currentUser;

    if (user) {

      // User has authenticated with Google.
      // Now the Login button completes the process.
      window.location.href = "index.html";

      return;
    }
  }


  // NORMAL EMAIL/PASSWORD LOGIN

  const email = username.value.trim();
  const userPassword = password.value;

  if (!email || !userPassword) {

    message.textContent =
      "Please enter email and password.";

    message.style.color = "red";

    return;
  }


  try {

    await signInWithEmailAndPassword(
      auth,
      email,
      userPassword
    );

    // Successful normal login
    window.location.href = "index.html";

  } catch (error) {

    message.textContent =
      "Invalid email or password.";

    message.style.color = "red";

  }

});

</script>

</body>
</html>
