<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #141e30, #243b55);
    }

    .login-box {
      width: 90%;
      max-width: 380px;
      padding: 30px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 35px rgba(0,0,0,0.3);
      text-align: center;
    }

    h2 {
      color: white;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 8px;
      border: none;
      outline: none;
      font-size: 15px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      background: white;
      color: #243b55;
    }

    .btn:hover {
      opacity: 0.9;
    }

    #message {
      color: white;
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Login</h2>

    <input
      id="username"
      placeholder="Enter email or mobile"
      style="margin-top:8px;padding:10px;border-radius:8px;border:none"
    />

    <input
      id="password"
      type="password"
      placeholder="Enter password"
      style="margin-top:8px;padding:10px;border-radius:8px;border:none"
    />

    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn" onclick="attemptLogin()">Login</button>
    </div>

    <div id="message"></div>
  </div>

  <script src="sript.js">
    
  </script>

</body>
</html>
