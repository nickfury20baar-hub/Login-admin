<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
    }

    .login-box {
      width: 90%;
      max-width: 380px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      color: #222;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #007bff;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 7px;
      background: #007bff;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #0069d9;
    }

    /* Success Popup */
    .popup {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .popup-box {
      width: 90%;
      max-width: 350px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    .success-icon {
      font-size: 45px;
      color: #28a745;
      margin-bottom: 10px;
    }

    .popup-box h3 {
      margin: 5px 0 10px;
      color: #222;
    }

    .popup-box p {
      color: #666;
      margin-bottom: 20px;
    }

    .close-btn {
      padding: 10px 25px;
      border: none;
      border-radius: 6px;
      background: #28a745;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h2>Login</h2>

    <input
      type="text"
      id="username"
      placeholder="Email or Mobile"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button class="login-btn" onclick="attemptLogin()">
      Login
    </button>
  </div>

  <!-- Success Popup -->
  <div class="popup" id="successPopup">
    <div class="popup-box">
      <div class="success-icon">✓</div>
      <h3>Login Successful</h3>
      <p>You have successfully logged in.</p>
      <button class="close-btn" onclick="closePopup()">
        Continue
      </button>
    </div>
  </div>

  <script>
    function attemptLogin() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();

      if (username === "" || password === "") {
        alert("Please enter username and password.");
        return;
      }

      document.getElementById("successPopup").style.display = "flex";
    }

    function closePopup() {
      document.getElementById("successPopup").style.display = "none";
    }
  </script>

</body>
</html>
